name = "smarttd-push"
main = "worker.js"
compatibility_date = "2026-08-01"

# Crea el namespace con: wrangler kv namespace create SUBS
# y pega aquí el id que te devuelva
kv_namespaces = [
  { binding = "SUBS", id = "PEGA_AQUI_TU_KV_ID" }
]

[vars]
NTFY_TOPIC = "smarttd-monitor"
VAPID_PUBLIC_KEY = "PEGA_AQUI_TU_CLAVE_PUBLICA"
VAPID_SUBJECT = "mailto:tucorreo@ejemplo.com"

# La clave PRIVADA no va aquí (no la subas nunca a git).
# Se sube como secreto con:
#   wrangler secret put VAPID_PRIVATE_KEY
